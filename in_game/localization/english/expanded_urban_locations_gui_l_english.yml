l_english:
 # Generic Action Names
 designate_mining_specialization: "Designate Mining Specialization"
 designate_mining_specialization_desc: "Transform this settlement into a mining hub. Incompatible buildings will be destroyed."
 designate_mining_select: "Select a Town or City"

 designate_farming_specialization: "Designate Farming Specialization"
 designate_farming_specialization_desc: "Transform this settlement into an agricultural center. Incompatible buildings will be destroyed."
 designate_farming_select: "Select a Town or City"

 designate_forestry_specialization: "Designate Forestry Specialization"
 designate_forestry_specialization_desc: "Transform this settlement into a forestry center. Incompatible buildings will be destroyed."
 designate_forestry_select: "Select a Town or City"

 designate_gathering_specialization: "Designate Gathering Specialization"
 designate_gathering_specialization_desc: "Transform this settlement into a gathering hub. Incompatible buildings will be destroyed."
 designate_gathering_select: "Select a Town or City"

 designate_commercial_specialization: "Designate Commercial Specialization"
 designate_commercial_specialization_desc: "Transform this settlement into a commercial hub. Incompatible buildings will be destroyed."
 designate_commercial_select: "Select a Town or City"

 # Legacy GUI Labels (may still be used)
 SELECT_SPECIALIZATION: "Select Specialization"
 SPECIALIZATION_INSTRUCTIONS: "Choose a specialization for this settlement. Options are based on local resources."

 MINING_SPECIALIZATION: "Mining"
 MINING_SPECIALIZATION_DESC: "Focus on extracting ores and minerals. Requires mining resources."

 FARMING_SPECIALIZATION: "Farming"
 FARMING_SPECIALIZATION_DESC: "Focus on agricultural production. Requires farming resources."

 GATHERING_SPECIALIZATION: "Gathering"
 GATHERING_SPECIALIZATION_DESC: "Focus on collecting natural resources. Requires gathering resources."

 FORESTRY_SPECIALIZATION: "Forestry"
 FORESTRY_SPECIALIZATION_DESC: "Focus on woodland production. Requires forestry resources."

 COMMERCIAL_SPECIALIZATION: "Commercial"
 COMMERCIAL_SPECIALIZATION_DESC: "Focus on trade and commerce. Always available."

 CANCEL: "Cancel"

 # Specialization Modifiers - Town
 STATIC_MODIFIER_NAME_mining_town_specialization: "Mining Town"
 STATIC_MODIFIER_DESC_mining_town_specialization: "A settlement shaped by the pit and the pickaxe. Less land for extraction, but skilled overseers and purpose-built infrastructure keep the ore flowing."

 STATIC_MODIFIER_NAME_farming_town_specialization: "Farming Town"
 STATIC_MODIFIER_DESC_farming_town_specialization: "A settlement built on fertile soil and honest labor. Fewer fields, but granaries, mills, and experienced farmhands make every acre count."

 STATIC_MODIFIER_NAME_gathering_town_specialization: "Gathering Town"
 STATIC_MODIFIER_DESC_gathering_town_specialization: "A settlement sustained by what the land provides. Less wilderness to harvest, but local expertise turns modest yields into steady returns."

 STATIC_MODIFIER_NAME_forestry_town_specialization: "Forestry Town"
 STATIC_MODIFIER_DESC_forestry_town_specialization: "A settlement carved from the wilderness. Less forest to fell, but sawmills and seasoned woodsmen make the most of what remains."

 STATIC_MODIFIER_NAME_commercial_town_specialization: "Commercial Town"
 STATIC_MODIFIER_DESC_commercial_town_specialization: "A settlement where the market square matters more than the fields. Less raw output, but merchants and traders make this place prosper."

 # Specialization Modifiers - City
 STATIC_MODIFIER_NAME_mining_city_specialization: "Mining City"
 STATIC_MODIFIER_DESC_mining_city_specialization: "A city that grew from its mines. Raw extraction suffers, but an influx of cheap laborers and a local supply of industry experts feed efficient manufacturing."

 STATIC_MODIFIER_NAME_farming_city_specialization: "Farming City"
 STATIC_MODIFIER_DESC_farming_city_specialization: "A city rooted in rich farmland. The fields have shrunk, but bakeries, breweries, and textile mills turn local harvests into refined goods."

 STATIC_MODIFIER_NAME_gathering_city_specialization: "Gathering City"
 STATIC_MODIFIER_DESC_gathering_city_specialization: "A city built on nature's bounty. Less land to harvest, but generations of expertise turn raw materials into valuable trade goods."

 STATIC_MODIFIER_NAME_forestry_city_specialization: "Forestry City"
 STATIC_MODIFIER_DESC_forestry_city_specialization: "A city born from the timber trade. The surrounding woods have thinned, but master carpenters and furniture makers keep the economy thriving."

 STATIC_MODIFIER_NAME_commercial_city_specialization: "Commercial City"
 STATIC_MODIFIER_DESC_commercial_city_specialization: "A city where coin is king. The hinterlands produce little, but bustling markets and wealthy merchants more than make up the difference."

 # Building Cap Descriptions
 LOCATION_IS_SPECIALIZED: "Location is specialized"

 # Message Types (disabled via messagetypes.txt)
 PERFORM_designate_mining_specialization_ACTION: "Mining specialization designated"
 PERFORM_designate_farming_specialization_ACTION: "Farming specialization designated"
 PERFORM_designate_forestry_specialization_ACTION: "Forestry specialization designated"
 PERFORM_designate_gathering_specialization_ACTION: "Gathering specialization designated"
 PERFORM_designate_commercial_specialization_ACTION: "Commercial specialization designated"

