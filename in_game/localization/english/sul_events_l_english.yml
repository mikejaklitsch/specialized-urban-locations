l_english:
 sul.100.title: "Fate of the Market of [scope:target.GetNameWithNoTooltip]"
 sul.100.desc: "Our forces have seized the market of [scope:target.GetNameWithNoTooltip]. With our own merchants already well-established in the region, this conquered market may prove redundant — or it may yet serve our interests if left intact."
 sul.100.a: "Let the locals return to their trades"
 sul.100.a.tt: "The market is dismantled peacefully. The people of [scope:target.GetNameWithNoTooltip] will refocus on the resources their land provides."
 sul.100.b: "The market shall remain"
 sul.100.b.tt: "We preserve the market of [scope:target.GetNameWithNoTooltip] under our administration."
