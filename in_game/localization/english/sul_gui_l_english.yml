 # Generic Action Names
 sul_designate_mining_specialization: "Specialize: Mining"
 sul_designate_mining_specialization_desc: "Transform this settlement into a mining hub. Incompatible buildings will be destroyed.\n\nConstruction can be canceled at any time for a full refund. Respecialization effects only apply when construction completes."
 designate_mining_select: "Select a Town or City"

 sul_designate_farming_specialization: "Specialize: Farming"
 sul_designate_farming_specialization_desc: "Transform this settlement into an agricultural center. Incompatible buildings will be destroyed.\n\nConstruction can be canceled at any time for a full refund. Respecialization effects only apply when construction completes."
 designate_farming_select: "Select a Town or City"

 sul_designate_woodland_specialization: "Specialize: Woodland"
 sul_designate_woodland_specialization_desc: "Transform this settlement into a woodland center. Incompatible buildings will be destroyed.\n\nConstruction can be canceled at any time for a full refund. Respecialization effects only apply when construction completes."
 designate_woodland_select: "Select a Town or City"

 sul_designate_gathering_specialization: "Specialize: Gathering"
 sul_designate_gathering_specialization_desc: "Transform this settlement into a gathering hub. Incompatible buildings will be destroyed.\n\nConstruction can be canceled at any time for a full refund. Respecialization effects only apply when construction completes."
 designate_gathering_select: "Select a Town or City"

 sul_designate_commercial_specialization: "Specialize: Commercial"
 sul_designate_commercial_specialization_desc: "Transform this settlement into a commercial hub. Incompatible buildings will be destroyed.\n\nConstruction can be canceled at any time for a full refund. Respecialization effects only apply when construction completes."
 designate_commercial_select: "Select a Town or City"

