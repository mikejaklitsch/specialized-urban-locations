 SUL_DEMAND_FORMULA_DESC: "Scales how much each pop demands goods.\n\n#bold Base Multiplier:#!\nmultiplier = floor + (ceiling - floor) × X / (X + k)\nwhere X = Local GDP × Effective Wealth Share\n\n#bold Parameters:#!\n• #italic floor#! — minimum demand (0.8×)\n• #italic ceiling#! — maximum demand (varies by class)\n• #italic k#! — wealth level for half-max demand (higher k = slower growth)\n\n#bold [sul_demand_elasticity|E]:#!\nBase multiplier dampened by category:\neffective = 1 + (base - 1) × multiplier\n\n#bold Peasant Enfranchisement:#!\nPeasant and Noble wealth shares adjusted by enfranchisement (10-100%):\n• Low enfranchisement = nobles seize more peasant wealth\n• Peasants, Soldiers, and Laborers use adjusted peasant share\n• Nobles use adjusted noble share (includes seized wealth)"
 SUL_DEMAND_FORMULA_MAXIMUMS_HEADER: "Class Ranges (Floor → Ceiling)"
 SUL_DEMAND_FORMULA_ELASTICITY_HEADER: "[sul_demand_elasticity|E] Dampening"
 SUL_ASYMPTOTE_TOOLTIP: "Demand range from minimum to maximum"

