 # Specialization Modifiers - Rural
 STATIC_MODIFIER_NAME_sul_mining_rural_specialization: "Mining Settlement"
 STATIC_MODIFIER_DESC_sul_mining_rural_specialization: "A settlement built around mines and quarries, extracting ore and stone for local smiths and craftsmen."

 STATIC_MODIFIER_NAME_sul_farming_rural_specialization: "Farming Settlement"
 STATIC_MODIFIER_DESC_sul_farming_rural_specialization: "A settlement sustained by its fields and pastures, growing crops and raising livestock."

 STATIC_MODIFIER_NAME_sul_gathering_rural_specialization: "Gathering Settlement"
 STATIC_MODIFIER_DESC_sul_gathering_rural_specialization: "A settlement that collects what the land and sea provide — salt, clay, wool, fish, and other natural resources."

 STATIC_MODIFIER_NAME_sul_woodland_rural_specialization: "Woodland Settlement"
 STATIC_MODIFIER_DESC_sul_woodland_rural_specialization: "A settlement living off the forest, felling timber, trapping game, and collecting forest products."

 STATIC_MODIFIER_NAME_sul_commercial_rural_specialization: "Commercial Settlement"
 STATIC_MODIFIER_DESC_sul_commercial_rural_specialization: "A small trading post where local goods are bought, sold, and worked into finished products."

 # Specialization Modifiers - Town
 STATIC_MODIFIER_NAME_sul_mining_town_specialization: "Mining Town"
 STATIC_MODIFIER_DESC_sul_mining_town_specialization: "A town centered on mining and metalworking, turning raw ore into tools, weapons, and finished metal goods."

 STATIC_MODIFIER_NAME_sul_farming_town_specialization: "Farming Town"
 STATIC_MODIFIER_DESC_sul_farming_town_specialization: "A town surrounded by farmland, processing its harvests into beer, wine, leather, and other goods."

 STATIC_MODIFIER_NAME_sul_gathering_town_specialization: "Gathering Town"
 STATIC_MODIFIER_DESC_sul_gathering_town_specialization: "A town built around resource collection, refining raw materials into glass, pottery, and medicines."

 STATIC_MODIFIER_NAME_sul_woodland_town_specialization: "Woodland Town"
 STATIC_MODIFIER_DESC_sul_woodland_town_specialization: "A town built around forestry and woodworking, turning timber into furniture, paper, and charcoal."

 STATIC_MODIFIER_NAME_sul_commercial_town_specialization: "Commercial Town"
 STATIC_MODIFIER_DESC_sul_commercial_town_specialization: "A market town where merchants trade goods and workshops produce cloth, printed works, and naval supplies."

 # Specialization Modifiers - City
 STATIC_MODIFIER_NAME_sul_mining_city_specialization: "Mining City"
 STATIC_MODIFIER_DESC_sul_mining_city_specialization: "A city that grew from its mines, with forges and workshops turning ore into arms, tools, and steel."

 STATIC_MODIFIER_NAME_sul_farming_city_specialization: "Farming City"
 STATIC_MODIFIER_DESC_sul_farming_city_specialization: "A city fed by rich farmland, with breweries, wineries, and tanneries processing the surrounding harvests."

 STATIC_MODIFIER_NAME_sul_gathering_city_specialization: "Gathering City"
 STATIC_MODIFIER_DESC_sul_gathering_city_specialization: "A city sustained by natural resources, with glassworks, potteries, and apothecaries refining what the land provides."

 STATIC_MODIFIER_NAME_sul_woodland_city_specialization: "Woodland City"
 STATIC_MODIFIER_DESC_sul_woodland_city_specialization: "A city rooted in the timber trade, with sawmills, carpentry workshops, and paper mills fed by surrounding forests."

 STATIC_MODIFIER_NAME_sul_commercial_city_specialization: "Commercial City"
 STATIC_MODIFIER_DESC_sul_commercial_city_specialization: "A city driven by commerce, with bustling markets and manufactories producing cloth, books, and naval supplies."

