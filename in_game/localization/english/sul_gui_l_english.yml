 # Specialization Modifiers - Rural
 STATIC_MODIFIER_NAME_sul_mining_rural_specialization: "Mining Settlement"
 STATIC_MODIFIER_DESC_sul_mining_rural_specialization: "A small settlement built around a mine shaft or quarry. The locals know every seam and vein in the surrounding hills."

 STATIC_MODIFIER_NAME_sul_farming_rural_specialization: "Farming Settlement"
 STATIC_MODIFIER_DESC_sul_farming_rural_specialization: "A humble farming community where life follows the rhythm of the seasons. Every household tends their plot with care."

 STATIC_MODIFIER_NAME_sul_gathering_rural_specialization: "Gathering Settlement"
 STATIC_MODIFIER_DESC_sul_gathering_rural_specialization: "A small community that lives by what nature provides. The locals know every salt flat, clay pit, and fishing spot for miles."

 STATIC_MODIFIER_NAME_sul_woodland_rural_specialization: "Woodland Settlement"
 STATIC_MODIFIER_DESC_sul_woodland_rural_specialization: "A settlement nestled at the forest's edge. The people here know which trees to fell and which paths lead to the best hunting grounds."

 STATIC_MODIFIER_NAME_sul_commercial_rural_specialization: "Commercial Settlement"
 STATIC_MODIFIER_DESC_sul_commercial_rural_specialization: "A crossroads settlement where travelers stop to trade. Small but enterprising, with a market day that draws folk from surrounding areas."

 # Specialization Modifiers - Town
 STATIC_MODIFIER_NAME_sul_mining_town_specialization: "Mining Town"
 STATIC_MODIFIER_DESC_sul_mining_town_specialization: "A settlement shaped by the pit and the pickaxe. Less land for extraction, but skilled overseers and purpose-built infrastructure keep the ore flowing."

 STATIC_MODIFIER_NAME_sul_farming_town_specialization: "Farming Town"
 STATIC_MODIFIER_DESC_sul_farming_town_specialization: "A settlement built on fertile soil and honest labor. Fewer fields, but granaries, mills, and experienced farmhands make every acre count."

 STATIC_MODIFIER_NAME_sul_gathering_town_specialization: "Gathering Town"
 STATIC_MODIFIER_DESC_sul_gathering_town_specialization: "A settlement sustained by what the land provides. Less wilderness to harvest, but local expertise turns modest yields into steady returns."

 STATIC_MODIFIER_NAME_sul_woodland_town_specialization: "Woodland Town"
 STATIC_MODIFIER_DESC_sul_woodland_town_specialization: "A settlement carved from the wilderness. Less forest to fell, but sawmills and seasoned woodsmen make the most of what remains."

 STATIC_MODIFIER_NAME_sul_commercial_town_specialization: "Commercial Town"
 STATIC_MODIFIER_DESC_sul_commercial_town_specialization: "A settlement where the market square matters more than the fields. Less raw output, but merchants and traders make this place prosper."

 # Specialization Modifiers - City
 STATIC_MODIFIER_NAME_sul_mining_city_specialization: "Mining City"
 STATIC_MODIFIER_DESC_sul_mining_city_specialization: "A city that grew from its mines. Raw extraction suffers, but an influx of cheap laborers and a local supply of industry experts feed efficient manufacturing."

 STATIC_MODIFIER_NAME_sul_farming_city_specialization: "Farming City"
 STATIC_MODIFIER_DESC_sul_farming_city_specialization: "A city rooted in rich farmland. The fields have shrunk, but bakeries, breweries, and textile mills turn local harvests into refined goods."

 STATIC_MODIFIER_NAME_sul_gathering_city_specialization: "Gathering City"
 STATIC_MODIFIER_DESC_sul_gathering_city_specialization: "A city built on nature's bounty. Less land to harvest, but generations of expertise turn raw materials into valuable trade goods."

 STATIC_MODIFIER_NAME_sul_woodland_city_specialization: "Woodland City"
 STATIC_MODIFIER_DESC_sul_woodland_city_specialization: "A city born from the timber trade. The surrounding woods have thinned, but master carpenters and furniture makers keep the economy thriving."

 STATIC_MODIFIER_NAME_sul_commercial_city_specialization: "Commercial City"
 STATIC_MODIFIER_DESC_sul_commercial_city_specialization: "A city where coin is king. The hinterlands produce little, but bustling markets and wealthy merchants more than make up the difference."

 # Building Cap Descriptions
 LOCATION_IS_SPECIALIZED: "Location is specialized"

 # Cooldown Modifier (decaying over 5 years)
 STATIC_MODIFIER_NAME_sul_recently_respecialized: "Recently Respecialized"
 STATIC_MODIFIER_DESC_sul_recently_respecialized: "This settlement is adapting to its new economic focus. Production penalties decrease over time as the population adjusts."

 # Can Respecialize modifier type
 modifier_sul_can_respecialize: "Can Respecialize"

 # Population Pressure Modifiers (30% = balanced point)
 STATIC_MODIFIER_NAME_sul_capacity_pressure_0: "Very Low Population Density"
 STATIC_MODIFIER_DESC_sul_capacity_pressure_0: "This settlement has abundant space for new residents. Migrants are drawn to the opportunity and the peaceful atmosphere."
 STATIC_MODIFIER_NAME_sul_capacity_pressure_10: "Low Population Density"
 STATIC_MODIFIER_DESC_sul_capacity_pressure_10: "Plenty of room remains for growth. The settlement attracts newcomers seeking a fresh start."
 STATIC_MODIFIER_NAME_sul_capacity_pressure_20: "Moderate Population Density"
 STATIC_MODIFIER_DESC_sul_capacity_pressure_20: "The settlement has room to grow. New residents find the area appealing and tensions are low."
 STATIC_MODIFIER_NAME_sul_capacity_pressure_30: "Balanced Population Density"
 STATIC_MODIFIER_DESC_sul_capacity_pressure_30: "Population and capacity are in perfect balance. The settlement thrives with ideal conditions for sustained development."
 STATIC_MODIFIER_NAME_sul_capacity_pressure_40: "Mild Overcrowding"
 STATIC_MODIFIER_DESC_sul_capacity_pressure_40: "The settlement is becoming crowded. Some residents consider leaving for less congested areas."
 STATIC_MODIFIER_NAME_sul_capacity_pressure_50: "Moderate Overcrowding"
 STATIC_MODIFIER_DESC_sul_capacity_pressure_50: "Competition for space is noticeable. Residents grow restless and some migrate elsewhere."
 STATIC_MODIFIER_NAME_sul_capacity_pressure_60: "Overcrowded"
 STATIC_MODIFIER_DESC_sul_capacity_pressure_60: "The settlement strains under its population. Discontent rises as people compete for limited resources."
 STATIC_MODIFIER_NAME_sul_capacity_pressure_70: "Heavy Overcrowding"
 STATIC_MODIFIER_DESC_sul_capacity_pressure_70: "Severe crowding creates tension among residents. Many leave in search of better conditions."
 STATIC_MODIFIER_NAME_sul_capacity_pressure_80: "Severe Overcrowding"
 STATIC_MODIFIER_DESC_sul_capacity_pressure_80: "The settlement groans under unsustainable population pressure. Unrest spreads as residents struggle for basic necessities."
 STATIC_MODIFIER_NAME_sul_capacity_pressure_90: "Critical Overcrowding"
 STATIC_MODIFIER_DESC_sul_capacity_pressure_90: "Living conditions have deteriorated dramatically. The desperate population threatens civil order as people flee in droves."
 STATIC_MODIFIER_NAME_sul_capacity_pressure_100: "Extreme Overcrowding"
 STATIC_MODIFIER_DESC_sul_capacity_pressure_100: "The settlement has reached a breaking point. Chaos reigns as the population far exceeds any sustainable capacity."

