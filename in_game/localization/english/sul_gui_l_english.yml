 # MAP MODE NAMES AND DESCRIPTIONS
 # ============================================
 # Cities mapmode (override)
 mapmode_cities_name: "Location Ranks"
 MAPMODE_CITIES: "#T $mapmode_cities_name$#!\nShows settlements colored by their economic specialization.\n\n#bold Specialization Colors:#!\nRed - Mining\nBlue - Gathering\nBrown - Woodland\nPurple - Commercial\nGreen - Farming\n\n#bold Rank Stripes:#!\nGold stripes indicate cities, dark stripes indicate towns."

 # Potential specialization mapmodes (names defined in sul_map_modes_l_english.yml)
 MAPMODE_SUL_MINING_POTENTIAL: "#T $mapmode_sul_mining_potential_name$#!\nHighlights locations eligible for mining specialization.\n\n#bold Eligible Resources:#!\nCoal, Iron, Copper, Tin, Lead, Silver, Gold, Gems, Stone, Marble, Saltpeter, Alum, Mercury\n\n#bold Eligible Topography:#!\nMountains, Wetlands\n\n#bold Color:#!\nRed - Can specialize in mining"
 MAPMODE_SUL_GATHERING_POTENTIAL: "#T $mapmode_sul_gathering_potential_name$#!\nHighlights locations eligible for gathering specialization.\n\n#bold Eligible Resources:#!\nSalt, Clay, Sand, Fish, Pearls, Amber, Medicaments, Wool\n\n#bold Eligible Geography:#!\nCoastal, River\n\n#bold Color:#!\nBlue - Can specialize in gathering"
 MAPMODE_SUL_WOODLAND_POTENTIAL: "#T $mapmode_sul_woodland_potential_name$#!\nHighlights locations eligible for woodland specialization.\n\n#bold Eligible Resources:#!\nLumber, Fur, Wild Game, Elephants, Incense, Beeswax, Dyes\n\n#bold Eligible Vegetation:#!\nForest, Woods\n\n#bold Color:#!\nBrown - Can specialize in woodland"
 MAPMODE_SUL_FARMING_POTENTIAL: "#T $mapmode_sul_farming_potential_name$#!\nHighlights locations eligible for farming specialization.\n\n#bold Eligible Resources:#!\nWheat, Rice, Maize, Millet, Legumes, Potato, Livestock, Horses, Silk, Cotton, Fiber Crops, Wine, Olives, Fruit, Sugar, Tobacco, Tea, Coffee, Cocoa, Pepper, Cloves, Chili, Saffron\n\n#bold Eligible Terrain:#!\nFarmland, Flatland with River, Flatland with Grasslands\n\n#bold Color:#!\nGreen - Can specialize in farming"

