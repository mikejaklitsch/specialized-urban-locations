l_english:
 inland_wharf: "River Wharf"
 inland_wharf_desc: "A simple wooden platform along the riverbank for loading and unloading small boats and barges. Essential for connecting rural settlements to river trade networks."
 inland_dock: "River Dock"
 inland_dock_desc: "A basic riverside facility for loading cargo onto river vessels. Provides access to inland waterway trade routes."
 inland_dry_dock: "River Barge Yard"
 inland_dry_dock_desc: "An organized depot for coordinating barge traffic along the river. Multiple vessels can be loaded and maintained simultaneously."
 inland_shipyard: "River Quay"
 inland_shipyard_desc: "A solid stone waterfront structure built to handle significant river commerce. The permanent construction allows for heavier cargo and more efficient operations."
 inland_grand_shipyard: "Grand River Quay"
 inland_grand_shipyard_desc: "An extensive waterfront complex with multiple loading bays, warehouses, and administrative buildings. A major hub for regional river trade."
 inland_naval_base: "Merchant Levee"
 inland_naval_base_desc: "A grand embankment lined with commercial facilities, counting houses, and trading halls. The ultimate expression of inland commerce, rivaling coastal ports in importance."
