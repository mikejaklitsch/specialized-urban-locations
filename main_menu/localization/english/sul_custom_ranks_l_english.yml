l_english:
 mining_rural_upgrade: "Establish Mining Settlement"
 mining_rural_downgrade: "Downgrade to Mining Settlement"
 mining_rural: "Mining Settlement"
 mining_rural_desc: "A rural settlement built around mineral extraction — quarries, open-pit mines, and smelting camps that draw laborers to the surrounding hills and mountains."
 mining_town: "Mining Town"
 mining_town_desc: "An established town whose economy revolves around mineral extraction and metalworking. Forges and workshops refine raw ore into tools, weapons, and luxury goods."
 mining_town_upgrade: "Upgrade to Mining Town"
 mining_city: "Mining City"
 mining_city_desc: "A fortified industrial center dominating the region's mineral wealth. Large-scale smelting operations, armories, and jewelry workshops drive a militarized economy."
 mining_city_upgrade: "Upgrade to Mining City"

 farming_rural_upgrade: "Establish Farming Settlement"
 farming_rural_downgrade: "Downgrade to Farming Settlement"
 farming_rural: "Farming Settlement"
 farming_rural_desc: "Fertile fields and pastoral lands sustain a growing agricultural community. Peasant farmers work the soil, producing grain, livestock, and raw foodstuffs."
 farming_town: "Farming Town"
 farming_town_desc: "A prosperous market town surrounded by cultivated farmland. Breweries, wineries, and tanneries process agricultural surplus into tradeable goods."
 farming_town_upgrade: "Upgrade to Farming Town"
 farming_city: "Farming City"
 farming_city_desc: "A major agricultural hub whose fertile hinterland feeds an entire region. Noble estates, granaries, and processing industries anchor a food-driven economy."
 farming_city_upgrade: "Upgrade to Farming City"

 gathering_rural_upgrade: "Establish Gathering Settlement"
 gathering_rural_downgrade: "Downgrade to Gathering Settlement"
 gathering_rural: "Gathering Settlement"
 gathering_rural_desc: "A coastal or riverside community sustained by fishing, salt collection, and the harvesting of natural materials from the surrounding environment."
 gathering_town: "Gathering Town"
 gathering_town_desc: "A port town thriving on maritime trade and resource collection. Glassblowers, potters, and apothecaries transform gathered materials into refined goods."
 gathering_town_upgrade: "Upgrade to Gathering Town"
 gathering_city: "Gathering City"
 gathering_city_desc: "A major maritime center with bustling harbors and shipyards. Porcelain workshops, saltpeter works, and medicament production drive a trade-oriented economy."
 gathering_city_upgrade: "Upgrade to Gathering City"

 woodland_rural_upgrade: "Establish Woodland Settlement"
 woodland_rural_downgrade: "Downgrade to Woodland Settlement"
 woodland_rural: "Woodland Settlement"
 woodland_rural_desc: "A frontier settlement nestled among dense forests. Lumberjacks, charcoal burners, and trappers harvest timber and forest products from the surrounding wilderness."
 woodland_town: "Woodland Town"
 woodland_town_desc: "A thriving town built on the timber trade. Sawmills, furniture workshops, and paper mills transform raw lumber into construction materials and finished goods."
 woodland_town_upgrade: "Upgrade to Woodland Town"
 woodland_city: "Woodland City"
 woodland_city_desc: "A major center of construction and manufacturing, supplied by vast timber reserves. Multiple building projects proceed simultaneously, fueled by cheap lumber and skilled craftsmen."
 woodland_city_upgrade: "Upgrade to Woodland City"

 commercial_rural_upgrade: "Establish Commercial Settlement"
 commercial_rural_downgrade: "Downgrade to Commercial Settlement"
 commercial_rural: "Commercial Settlement"
 commercial_rural_desc: "A crossroads community where merchants and peddlers converge. Market stalls and trading posts form the nucleus of a budding commercial network."
 commercial_town: "Commercial Town"
 commercial_town_desc: "A bustling market town at the heart of regional trade routes. Cloth merchants, booksellers, and harbor facilities attract burgher investment and migrant labor."
 commercial_town_upgrade: "Upgrade to Commercial Town"
 commercial_city: "Commercial City"
 commercial_city_desc: "A great emporium of international commerce. Vast merchant houses, extensive harbor infrastructure, and a wealthy burgher class drive trade across continents."
 commercial_city_upgrade: "Upgrade to Commercial City"

