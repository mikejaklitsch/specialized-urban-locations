l_english:
 # Specialization System Concepts
 game_concept_sul_building_level: "Building Level"
 game_concept_building_level: "Building Level"
 game_concept_building_levels: "Building Levels"
 game_concept_sul_building_level_desc: "Each building level in a [location|E] has cumulative effects:\n\n#bold Per Level:#!\n#G +0.1#! population capacity\n#G +0.1%#! population capacity modifier\n#G +0.04%#! trade center power\n#G +0.5%#! provisions output (offsets efficiency loss for food)\n#G +0.12#! monthly development\n\n#R -0.5%#! production efficiency (pressure to specialize)\n#R -0.5%#! max RGO size (less rural land)\n#R -0.005%#! population growth (urbanization slows growth)\n\nSpecialized [buildings|E] provide bonuses that offset the production efficiency penalty for goods matching their specialization."
 game_concept_sul_demand_elasticity: "Elasticity"
 game_concept_sul_demand_elasticity_desc: "Elasticity controls how much the wealth multiplier affects each category of good.\n\n[sul_category_necessities|E] are inelastic — everyone needs food and cloth regardless of wealth, so the multiplier barely changes demand (#Y ×0.2#!).\n\n[sul_category_common|E] goods are moderately elastic (#Y ×0.5#!).\n\n[sul_category_upper|E] goods are highly elastic (#Y ×0.8#!).\n\n[sul_category_luxury|E] goods scale fully with wealth (#Y ×1.0#!).\n\n#italic Formula: effective = 1 + (base - 1) × multiplier#!"
 game_concept_sul_category_necessities: "Necessities"
 game_concept_sul_category_necessities_desc: "Basic goods that all pops consume regardless of wealth.\n\n• Cloth\n• Beer\n• Pottery\n• Salt\n• Coal\n\nElasticity: #Y ×0.2#! — demand barely changes with wealth."
 game_concept_sul_category_common: "Common"
 game_concept_sul_category_common_desc: "Everyday goods consumed by most pops.\n\n• Furniture\n• Leather\n• Glass\n• Paper\n• Medicaments\n• Weaponry\n• Liquor\n• Fur\n\nElasticity: #Y ×0.5#! — demand moderately scales with wealth."
 game_concept_sul_category_upper: "Upper"
 game_concept_sul_category_upper_desc: "Refined goods consumed primarily by wealthier pops.\n\n• Fine Cloth\n• Silk\n• Books\n• Wine\n• Tea\n• Coffee\n• Cocoa\n• Sugar\n• Tobacco\n\nElasticity: #Y ×0.8#! — demand scales strongly with wealth."
 game_concept_sul_category_luxury: "Luxury"
 game_concept_sul_category_luxury_desc: "Elite goods consumed only by the wealthiest pops.\n\n• Jewelry\n• Porcelain\n• Lacquerware\n• Pepper\n• Cloves\n• Saffron\n• Chili\n• Incense\n• Pearls\n• Ivory\n\nElasticity: #Y ×1.0#! — demand scales fully with wealth."
