l_english:
 sul_add_all_locations_to_hre: "Add All Locations to the HRE"
 sul_add_all_locations_to_hre_desc: "Adds all eligible [location|ep] to the [holy_roman_empire|e] at once."

 sul_expand_hre_from_location: "Expand HRE From Location"
 sul_expand_hre_from_location_desc: "Adds the selected [location|e] and all connected eligible [location|ep] to the [holy_roman_empire|e]."
 sul_expand_hre_from_location_select: "Select [location|e] to expand from:"
 sul_expand_hre_from_location_none: "$no_valid_locations$"

 sul_add_province_to_hre: "Add Province to the HRE"
 sul_add_province_to_hre_desc: "Adds all eligible [location|ep] in the selected [location|ep]'s [province|e] to the [holy_roman_empire|e]."
 sul_add_province_to_hre_select: "Select [location|e] in the [province|e] to add:"
 sul_add_province_to_hre_none: "$no_valid_locations$"
