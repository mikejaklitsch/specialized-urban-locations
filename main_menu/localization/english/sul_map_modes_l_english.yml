l_english:
 # Urbanization map mode (REPLACE vanilla)
 SUL_DEV_MAP_TOOLTIP: "$LOCATION_NAME$\nUrbanization: $DEVELOPMENT$"
 SUL_LEGEND_DEV_LOW: "Low (0)"
 SUL_LEGEND_DEV_MID: "Equilibrium (50)"
 SUL_LEGEND_DEV_HIGH: "High (100)"

 # Urbanization map mode tooltip keys (SUL_DEV_MAP_ prefix to avoid collision with location tooltip keys)
 SUL_DEV_EQUILIBRIUM_HEADER: "Urbanization Equilibrium"
 SUL_DEV_MAP_EQUILIBRIUM_DESC: "Urbanization measures a location's shift from rural extraction to urban production. It rises from population pressure, building density, and market activity, and decays naturally toward an equilibrium set by the location's economic composition.\n\nAt low urbanization, raw material output thrives but manufacturing suffers. At high urbanization, production efficiency grows while extraction yields decline."
 SUL_DEV_MAP_CURRENT_LABEL: "Current"
 SUL_DEV_MAP_TOTAL_LABEL: "Monthly Change"
 SUL_DEV_MAP_EQUILIBRIUM_LABEL: "Equilibrium"
 SUL_DEV_MAP_MONTHLY_VALUE: "[Location.MakeScope.ScriptValue('sul_total_monthly_development')|+4]"
 SUL_DEV_MAP_EXTRACTION_TITLE: "Extraction (Dev 0)"
 SUL_DEV_MAP_EXTRACTION_DESC: "Modifier values at zero urbanization — a purely rural economy."
 SUL_DEV_MAP_PRODUCTION_TITLE: "Production (Dev 100)"
 SUL_DEV_MAP_PRODUCTION_DESC: "Modifier values at full urbanization — a purely urban economy."
 SUL_DEV_MAP_CURRENT_LOCATION_TITLE: "Location Effects"
 SUL_DEV_MAP_CURRENT_EXTRACTION_TITLE: "Extraction Goods"
 SUL_DEV_MAP_CURRENT_PRODUCTION_TITLE: "Production Goods"
 SUL_DEV_MAP_CURRENT_EFFECTS_TITLE: "Current Effects"

 # Urbanization equilibrium map mode
 mapmode_sul_development_equilibrium_name: "Urbanization Equilibrium"
 MAPMODE_SUL_DEVELOPMENT_EQUILIBRIUM: "#T Urbanization Equilibrium#!\nPredicted equilibrium from pop composition and building mix"
 SUL_EQ_MAP_TOOLTIP: "$LOCATION_NAME$\nCurrent Urbanization: [ROOT.GetLocation.GetDevelopment|2]\nMonthly Change: [ROOT.GetLocation.MakeScope.ScriptValue('sul_total_monthly_development')|V3]\nUrbanization Equilibrium: [ROOT.GetLocation.MakeScope.ScriptValue('sul_development_equilibrium')|2]"
 SUL_LEGEND_EQ_LOW: "Low (0)"
 SUL_LEGEND_EQ_MID: "Equilibrium (50)"
 SUL_LEGEND_EQ_HIGH: "High (100)"


 # Potential map modes
 mapmode_sul_mining_potential_name: "Mining Potential"
 mapmode_sul_gathering_potential_name: "Gathering Potential"
 mapmode_sul_woodland_potential_name: "Woodland Potential"
 mapmode_sul_farming_potential_name: "Farming Potential"
