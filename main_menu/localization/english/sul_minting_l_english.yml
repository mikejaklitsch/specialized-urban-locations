 TGS_DEBASEMENT_INC_BUTTON_TT: "#bold Click:#! +1%\n#bold Ctrl+Click:#! +10%\n#bold Shift+Click:#! +50%\n#bold Right-Click:#! Reset to 0%"
 TGS_DEBASEMENT_EXPLANATION: "[sul_minting_currency_debasement|E] increases [minting] income but causes [inflation]. The [inflation] cost per point is at least #bold twice#! that of legitimate [sul_minting_mint_monetization|e], and compounds further through [sul_minting_greshams_law|e].\n\nAt #bold 0%#!, [minting] behaves normally. Use [sul_minting_currency_rebasement|e] to reduce [inflation]."
 TGS_REBASEMENT_HEADER: "Currency Rebasement"
 TGS_REBASEMENT_EFFECTS_HEADER: "Monthly Effects"
 TGS_REBASEMENT_LEVEL_LABEL: "Rebasement Level"
 TGS_REBASEMENT_COST_LABEL: "Coin Recall Cost"
 TGS_REBASEMENT_DEFLATION_LABEL: "Monthly Inflation Reduction"
