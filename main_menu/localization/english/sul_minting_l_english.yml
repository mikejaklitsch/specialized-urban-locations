 TGS_REBASEMENT_INC_HUGE_TT: "Increase rebasement by #bold 50%#!"
 TGS_REBASEMENT_RESET_TT: "Reset rebasement to #bold 0%#!"
 TGS_REBASEMENT_DEC_BUTTON_TT: "#bold Click:#! -1%\n#bold Ctrl+Click:#! -10%\n#bold Shift+Click:#! -50%\n#bold Right-Click:#! Reset to 0%"
 TGS_REBASEMENT_INC_BUTTON_TT: "#bold Click:#! +1%\n#bold Ctrl+Click:#! +10%\n#bold Shift+Click:#! +50%\n#bold Right-Click:#! Reset to 0%"
 TGS_REBASEMENT_EXPLANATION: "The crown buys debased coins from circulation at face value and replaces them with pure ones. The more [inflation] there is, the more coins need replacing and the more it costs, but the deflation effect is stronger too.\n\nAt 0% [inflation] there is nothing to recall, so rebasement does nothing and cannot be activated. Cannot be used simultaneously with [sul_minting_currency_debasement|e]."
 game_concept_sul_minting_currency_debasement: "Currency Debasement"
 game_concept_sul_minting_currency_debasement_desc: "The crown reduces the precious metal content of coins, stretching each unit of [minting] goods into more coins.\n\n#bold Range:#! 0% to +200%\n\nEach point of debasement is at least #bold twice#! as inflationary as the same income from legitimate [sul_minting_mint_monetization|e], and this penalty compounds with existing [inflation] through [sul_minting_greshams_law|e].\n\nCannot be active alongside [sul_minting_currency_rebasement|e]."
 game_concept_sul_minting_currency_rebasement: "Currency Rebasement"
 game_concept_sul_minting_currency_rebasement_desc: "The crown buys debased coins from circulation at face value and replaces them with pure ones. The shortfall is paid from the treasury.\n\nBoth cost and deflation scale with current [inflation]. More debased coins in circulation means more to replace, but also faster deflation. Becomes ineffective as [inflation] approaches zero.\n\nCannot be active alongside [sul_minting_currency_debasement|e]."
 game_concept_sul_minting_crown_mint_price: "Crown Mint Price"
 game_concept_sul_minting_crown_mint_price_desc: "The official face value stamped on coins, set by the [sul_minting_minted_goods_value|e] plus the [sul_minting_mint_monetization|e] premium.\n\nWhen [market|e] prices for [minting] goods fall below this, the mint is profitable. When they rise above it, the mint runs at a loss."
 game_concept_sul_minting_coinage_face_value: "Coinage Face Value"
 game_concept_sul_minting_coinage_face_value_desc: "The [sul_minting_crown_mint_price|e] multiplied by the [sul_minting_currency_debasement|e] factor. At 0% debasement, this equals the Crown Mint Price. At higher levels, coins claim to be worth more than the metal they contain."
 game_concept_sul_minting_mint_profit: "Mint Profit"
 game_concept_sul_minting_mint_profit_desc: "[sul_minting_coinage_face_value|E] minus the [market|e] cost of the goods consumed. Positive profit means the mint earns money; negative means it loses.\n\nThe mint does not stop when unprofitable. Lower the [minting] slider or wait for prices to shift."
 game_concept_sul_minting_unified_inflation_adjustment: "Inflation Adjustment"
 game_concept_sul_minting_unified_inflation_adjustment_desc: "Scales base [minting] [inflation] by how much real value the mint injects into the economy. Profitable minting amplifies [inflation]; unprofitable minting reduces it.\n\nThe [inflation] cost of [sul_minting_currency_debasement|e] is subject to [sul_minting_greshams_law|e]."
 game_concept_sul_minting_minted_goods_value: "Mint Assay Value"
 game_concept_sul_minting_minted_goods_value_desc: "The crown's official valuation of raw [minting] goods, fixed by decree. Based on each good's base price before [market|e] supply and demand shift it. Does not move with prices.\n\nAdd the [sul_minting_mint_monetization|e] premium to get the [sul_minting_crown_mint_price|e]."
 game_concept_sul_minting_mint_monetization: "Monetization"
 game_concept_sul_minting_mint_monetization_desc: "The premium that coins carry over raw goods by being legal tender. A silver coin is worth more than an equivalent lump of silver because the crown guarantees its value.\n\n#bold How It Works#!\nDerived from the country's wage payments and trade activity relative to its economic base. Laws, advances, privileges, and buildings that affect [minting] may increase or decrease it.\n\nApplied on top of the [sul_minting_minted_goods_value|e] to produce the [sul_minting_crown_mint_price|e]."
 game_concept_sul_minting_price_efficiency: "Minting Price Efficiency"
 game_concept_sul_minting_price_efficiency_desc: "Compares the [sul_minting_crown_mint_price|e] to the actual [market|e] cost of [minting] goods. Cheap goods mean high efficiency; expensive goods mean low.\n\nAdjusts both [minting] income and [inflation] proportionally. Increased goods supply or higher [sul_minting_mint_monetization|e] raises efficiency."
 game_concept_sul_minting_bonus_multiplier: "Minting Bonus Scaling"
 game_concept_sul_minting_bonus_multiplier_desc: "How [sul_minting_price_efficiency|e] interacts with other [minting|e] bonuses from laws, advances, and buildings.\n\nWhen prices adjust [minting] income, bonuses from other sources are scaled to match automatically.\n\n#bold ×1.00#! = bonuses apply at full value.\n#bold ×0.50#! = prices halved income, so bonuses are halved too.\n#bold ×1.50#! = prices boosted income, so bonuses are boosted too."
 game_concept_sul_minting_bonus_scaling: "Minting Bonus Scaling Modifier"
 game_concept_sul_minting_bonus_scaling_desc: "Keeps other [minting|e] modifiers proportional to price-adjusted income. Amplifies them when the mint is efficient, offsets them when inefficient."
 game_concept_sul_minting_mint_profitability: "Mint Profitability"
 game_concept_sul_minting_mint_profitability_desc: "The mint buys goods at [market|e] prices and stamps them into coins at the [sul_minting_crown_mint_price|e]. The active currency law determines which goods are consumed.\n\nProfit = [sul_minting_coinage_face_value|e] minus [sul_minting_goods_cost|e]. Both [minting] income and [inflation] scale with this profit."
 TGS_INFLATION_HEADER: "Minting & Inflation"
 TGS_INFLATION_HOW_HEADER: "Minting Above Threshold"
