 TGS_INFLATION_TOTAL_LABEL: "Total Minting [inflation|E]"
 TGS_GRESHAM_PENALTY_LABEL: "Gresham Penalty"
 TGS_INFLATION_EXPLANATION: "The multiplier is the ratio of coin profit to the standard [minting] rate. It scales the base [inflation] from the slider: at ×1.0 [inflation] is unmodified, at ×0.5 it is halved.\n\n[sul_minting_currency_debasement|E] amplifies the multiplier through [sul_minting_greshams_law|e]."
 TGS_MONETIZATION_HEADER: "Monetization Sources"
 TGS_MONETIZATION_SOURCES_HEADER: "Breakdown"
 TGS_MONETIZATION_WAGES_LABEL: "Wages / (Economic Base × 4)"
 TGS_MONETIZATION_TRADE_LABEL: "Trade Income / (Trade + Tax Income)"
 TGS_MONETIZATION_TOTAL_LABEL: "Total [sul_minting_mint_monetization|E]"
 TGS_MONETIZATION_EXPLANATION: "#bold Wages#! are measured as total wage payments relative to economic base. Grows with population, wage rates, and [market|e] access.\n\n#bold Trade share#! is trade income as a fraction of total income. Grows with trade activity and merchant deployment.\n\n#bold Laws, advances, and buildings#! provide fixed bonuses from financial infrastructure."
 game_concept_sul_minting_goods_cost: "Minting Goods Cost"
 game_concept_sul_minting_goods_cost_desc: "The current [market|e] price of goods required for [minting] by the active currency law. Compared against the [sul_minting_crown_mint_price|e] to determine profit."
 game_concept_minting_goods_cost: "Minting Goods Cost"
