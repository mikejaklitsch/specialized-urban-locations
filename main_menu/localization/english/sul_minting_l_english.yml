 game_concept_sul_minting_greshams_law: "Gresham's Law"
 game_concept_sul_minting_greshams_law_desc: "When debased coins enter circulation alongside pure ones, people hoard the good coins and spend the bad. Merchants learn to distrust the currency and demand more coins per transaction, accelerating [inflation] beyond what the debasement alone would cause.\n\nThe higher [inflation] is when you debase, the less trust remains and the worse this effect becomes. Each point of [sul_minting_currency_debasement|e] is #bold twice#! as inflationary as the same [sul_minting_mint_monetization|e], and that multiplier grows with current [inflation]."
