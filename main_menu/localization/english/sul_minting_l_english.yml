 TGS_REBASEMENT_EXPLANATION: "The crown buys debased coins from circulation at face value and replaces them with pure ones. The more [inflation] there is, the more coins need replacing and the more it costs, but the deflation effect is stronger too.\n\nAt 0% [inflation] there is nothing to recall, so rebasement does nothing and cannot be activated. Cannot be used simultaneously with [sul_minting_currency_debasement|e]."
 game_concept_sul_minting_currency_debasement: "Currency Debasement"
 game_concept_sul_minting_currency_debasement_desc: "Trades coin purity for income.\n\n#bold How It Works#!\nDebasement reduces the precious metal content of coins, stretching each unit of [minting] goods into more coins. More income, but also more [inflation]. Both scale with the [minting] slider; if the mint is idle, debasement has no effect.\n\n#bold Range:#! 0% to +200%\n\nIncreases [minting] income and [inflation] proportional to both the debasement level and the [minting] slider.\n\nCannot be used simultaneously with [sul_minting_currency_rebasement|e]. Debasement is separate from [market|e] prices; [sul_minting_price_efficiency|e] depends on goods cost; debasement is about coin purity."
 game_concept_sul_minting_currency_rebasement: "Currency Rebasement"
 game_concept_sul_minting_currency_rebasement_desc: "Restores coin purity at great expense.\n\n#bold How It Works#!\nThe crown buys debased coins from circulation at face value and replaces them with newly minted pure coins. The shortfall between face value and actual metal content is a direct cost.\n\nBoth the cost and the deflation effect scale with current [inflation]. High inflation means more coins to replace: more expensive, but also more deflation. At 0% inflation, there is nothing to recall and rebasement cannot be used.\n\nCannot be used simultaneously with [sul_minting_currency_debasement|e]."
 game_concept_sul_minting_crown_mint_price: "Crown Mint Price"
 game_concept_sul_minting_crown_mint_price_desc: "The face value the crown officially stamps on its coins. This is what the crown decrees each coin is worth, and subjects are required to accept it at that rate.\n\nCalculated as the [sul_minting_minted_goods_value|e] plus the [sul_minting_mint_liquidity|e] premium. When [market|e] prices for minting goods fall below this, [minting] is profitable. When they rise above it, the mint runs at a loss.\n\n[sul_minting_currency_debasement|E] inflates the Crown Mint Price without adding more metal to the coins. The declared value goes up, but the actual content stays the same."
 game_concept_sul_minting_coinage_face_value: "Coinage Face Value"
 game_concept_sul_minting_coinage_face_value_desc: "The face value stamped on your coins. At 0% [sul_minting_currency_debasement|e], this equals the [sul_minting_crown_mint_price|e]; the coins contain exactly as much precious metal as they claim.\n\nWhen debasing, the Coinage Face Value exceeds the Crown Mint Price by the debasement factor. Coins claim to be worth more than the metal inside them. The gap between the declared value and the real content is what causes debasement [inflation]. As merchants and subjects start to notice, trust in the currency falls."
 game_concept_sul_minting_mint_profit: "Mint Profit"
 game_concept_sul_minting_mint_profit_desc: "The profit from minting one complete set of goods. This is the [sul_minting_crown_mint_price|e] (or [sul_minting_coinage_face_value|e] if debasing) minus what you paid for the goods on the [market|e].\n\nPositive profit means the mint is worth running. Negative profit means you are paying more for goods than the coins they produce are worth.\n\nThe mint does not stop automatically when unprofitable. You will continue losing money until you lower the [minting] slider or conditions change."
 game_concept_sul_minting_inflation_adjustment: "Inflation Adjustment"
 game_concept_sul_minting_inflation_adjustment_desc: "A correction to [minting] [inflation] that accounts for how productive your mint actually is.\n\nBase [minting] [inflation] assumes you are always converting goods into coins at full efficiency. In practice, if your [minting] goods are expensive on the [market|e], the mint is producing less real value per coin and should cause less [inflation]. If goods are cheap, the mint is very productive and [inflation] should be higher.\n\nThis adjustment scales base [minting] [inflation] up or down based on the [sul_minting_price_efficiency|e] of your mint, comparing the [sul_minting_crown_mint_price|e] to actual [market|e] cost."
 game_concept_sul_minting_minted_goods_value: "Mint Assay Value"
 game_concept_sul_minting_minted_goods_value_desc: "The crown's official valuation of the goods required for [minting], fixed by royal decree rather than by the [market|e].\n\nHistorically, mints operated from a standing schedule called a mint indenture that specified what each raw material was worth for coinage: one unit of silver worth X, one unit of gold worth Y, regardless of what those goods traded for that week. This is that schedule.\n\nIn practice, this valuation is set to the base price of each required good, the default value a good holds before [market|e] supply and demand push it higher or lower. It does not move with prices.\n\nAdd the [sul_minting_mint_liquidity|e] premium and you get the [sul_minting_crown_mint_price|e], which is the face value stamped on finished coins."
 game_concept_sul_minting_mint_liquidity: "Liquidity"
 game_concept_sul_minting_mint_liquidity_desc: "The premium that coins carry over raw goods simply by being legal tender. A silver coin is worth more than an equivalent lump of silver because the crown guarantees its value and everyone is required to accept it as payment.\n\n#bold How It Works#!\nAll nations start with a base liquidity of #bold 100%#!. Laws, advances, privileges, and buildings that affect [minting] may increase or decrease it.\n\nThis premium is applied on top of the [sul_minting_minted_goods_value|e] to produce the [sul_minting_crown_mint_price|e]. Higher liquidity means more valuable coins and more profitable minting."
 game_concept_sul_minting_price_efficiency: "Minting Price Efficiency"
 game_concept_sul_minting_price_efficiency_desc: "How efficiently your mint converts goods into coins, based on [market|e] prices.\n\nCompares the [sul_minting_crown_mint_price|e] (what coins are worth) to what the goods actually cost on the [market]. When goods are cheap, each coin contains more real value and the mint is highly efficient. When goods are expensive, the mint produces less real value per coin.\n\nThis ratio adjusts both [minting] income and [inflation]. An efficient mint generates more income and more [inflation]; an inefficient one generates less of both.\n\nTo improve efficiency, lower [market] prices for your [minting] goods (increase supply, reduce demand) or invest in laws and advances that increase [sul_minting_mint_liquidity|e]."
 game_concept_sul_minting_bonus_multiplier: "Minting Bonus Scaling"
 game_concept_sul_minting_bonus_multiplier_desc: "How [sul_minting_price_efficiency|e] interacts with other [minting|e] bonuses from laws, advances, and buildings.\n\nWhen prices adjust [minting] income, bonuses from other sources are scaled to match automatically.\n\n#bold ×1.00#! = bonuses apply at full value.\n#bold ×0.50#! = prices halved income, so bonuses are halved too.\n#bold ×1.50#! = prices boosted income, so bonuses are boosted too."
 game_concept_sul_minting_bonus_scaling: "Minting Bonus Scaling Modifier"
 game_concept_sul_minting_bonus_scaling_desc: "Keeps other [minting|e] modifiers (from laws, advances, buildings) proportional to price-adjusted income.\n\nOffsets bonuses when prices reduce income, amplifies them when prices boost income. At #bold -100%#! price efficiency all other modifiers are fully offset."
 game_concept_sul_minting_mint_profitability: "Mint Profitability"
 game_concept_sul_minting_mint_profitability_desc: "[minting|e] income comes from the profit of turning raw goods into coins.\n\n#bold How It Works#!\nThe mint buys goods at [market|e] prices and stamps them into coins at the [sul_minting_crown_mint_price|e]. The Crown Mint Price is the [sul_minting_minted_goods_value|e] (the statutory assay) plus the [sul_minting_mint_liquidity|e] premium. Your currency law sets which goods are consumed.\n\nIf the Crown Mint Price is higher than what the goods cost, [minting] makes money. If goods get too expensive, income falls. The [minting] tooltip shows the full breakdown.\n\n[sul_minting_currency_debasement|E] stamps coins at a higher face value than the assay warrants. The goods are the same, but the coins claim to be worth more. Trust in the currency falls as people notice.\n\nOther [minting] bonuses from laws, advances, and buildings are scaled automatically to stay proportional with price-adjusted income."
 TGS_INFLATION_HEADER: "Minting & Inflation"
 TGS_MINTING_INFLATION_HEADER: "[sul_minting_inflation_adjustment|E]"
 TGS_INFLATION_MINT_EFFICIENCY_LABEL: "[sul_minting_efficiency|E] Effect on [inflation|E]"
 TGS_INFLATION_BASE_LABEL: "Base Minting [inflation|E]"
 TGS_INFLATION_ADJUSTMENT_LABEL: "Net Adjustment"
 TGS_INFLATION_TOTAL_HEADER: "Total"
 TGS_INFLATION_TOTAL_LABEL: "Total Minting [inflation|E]"
 TGS_INFLATION_EXPLANATION: "The real value your mint adds to the market determines how much [inflation] it produces. When [minting] goods are cheap, each coin adds more value to circulation and [inflation] rises. When goods are expensive, less real value enters the market and [inflation] falls."
 game_concept_sul_minting_goods_cost: "Minting Goods Cost"
 game_concept_sul_minting_goods_cost_desc: "The current [market|e] price of one unit of each good required for [minting].\n\nYour currency law determines which goods are consumed. This total is compared against the [sul_minting_crown_mint_price|e] to determine [sul_minting_price_efficiency|e] and [sul_minting_mint_profit|e].\n\nWhen this cost exceeds the [sul_minting_crown_mint_price|e], the mint runs at a loss and [minting] [inflation] is reduced."
