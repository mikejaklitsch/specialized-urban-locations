l_english:
 MODIFIER_TYPE_NAME_sul_power_projection: "Power Projection"
 MODIFIER_TYPE_DESC_sul_power_projection: "Affects how much [power_projection|el] a country has."
 MODIFIER_TYPE_NAME_monthly_sul_power_projection: "Monthly Power Projection"
 MODIFIER_TYPE_DESC_monthly_sul_power_projection: "Monthly change to [power_projection|el]."
 AUTO_MODIFIER_NAME_sul_power_projection_impact: "[power_projection|e]"
 AUTO_MODIFIER_NAME_sul_projection_drag_control: "[sul_projection_control_weighted_population|e]"
 AUTO_MODIFIER_NAME_sul_projection_drag_culture: "[sul_projection_cultural_friction|e]"
 AUTO_MODIFIER_NAME_sul_projection_drag_religion: "[sul_projection_religious_friction|e]"
 AUTO_MODIFIER_NAME_sul_projection_drag_diplomacy: "[diplomatic_capacity_used|e]"

 POWER_PROJECTION_TT_TEXT: "$game_concept_power_projection$ of [Country.MakeScope.ScriptValue('sul_power_projection_display')|1W] is due to:"

 power_projection_greater_than: "The [power_projection|e] of [COUNTRY.GetName] is greater than [TARGET_COUNTRY.GetName]($NUM$)"
 power_projection_greater_or_equal: "The [power_projection|e] of [COUNTRY.GetName] is greater or equal to [TARGET_COUNTRY.GetName]($NUM$)"

 sul_projection_map_positive: "[LOCATION.GetOwner.GetName] projects outward — [power_projection|el] [LOCATION.GetOwner.MakeScope.ScriptValue('sul_power_projection_display')|=0]"
 sul_projection_map_negative: "[LOCATION.GetOwner.GetName] is adrift — [power_projection|el] [LOCATION.GetOwner.MakeScope.ScriptValue('sul_power_projection_display')|=0]"
 sul_projection_map_neutral: "[LOCATION.GetOwner.GetName] is holding steady — [power_projection|el] [LOCATION.GetOwner.MakeScope.ScriptValue('sul_power_projection_display')|=0]"

 game_concept_sul_projection_control_weighted_population: "Control Weighted Population"
 game_concept_sul_projection_control_weighted_population_desc: "The share of the country's population living under direct [control|el]. Calculated as #bold (controlled population / total population) − 1#!. A fully controlled country contributes nothing; uncontrolled territories drag [power_projection|el] downward."

 game_concept_sul_projection_cultural_friction: "Cultural Friction"
 game_concept_sul_projection_cultural_friction_desc: "The drag on [power_projection|el] from population in non-[accepted_cultures|el]. Calculated as the share of total population in unaccepted cultures, on a 0..−1 scale."

 game_concept_sul_projection_religious_friction: "Religious Friction"
 game_concept_sul_projection_religious_friction_desc: "The drag on [power_projection|el] from population not following the state [religion|el]. Counts both heretics (same religious group) and heathens (different group)."

 SUL_PROJECTION_DEBUG_DIPLO: "#bold DEBUG#! used: [Country.MakeScope.ScriptValue('sul_debug_diplo_used')|2] / base: [Country.MakeScope.ScriptValue('sul_debug_diplo_base')|2] / mod%: [Country.MakeScope.ScriptValue('sul_debug_diplo_modifier')|2] / total: [Country.MakeScope.ScriptValue('sul_debug_diplo_total')|2] / ratio: [Country.MakeScope.ScriptValue('sul_projection_diplo_usage_ratio')|2]"
 SUL_PROJECTION_EFFECTS_HEADER: "Power Projection Impact"
 SUL_PROJECTION_CURRENT_EFFECTS: "[ShowAutoModifierEffect('sul_power_projection_impact')]"

 AUTO_MODIFIER_NAME_complacency_impact: "Effect of [complacency|e]"
 NO_COMPLACENCY_EFFECT: "At 100% [complacency|e] it will have the following effects:\n[ShowAutoModifierEffect('complacency_impact')]"
 COMPLACENCY_EFFECT_TT: "[complacency|e] Impact"
 SUL_COMPLACENCY_EFFECTS: "[Localize(ShowAutoModifierEffectForCountry(Country.Self, 'complacency'))]"

