 game_concept_sul_projection_control_weighted_population: "Control Weighted Population"
 game_concept_sul_projection_control_weighted_population_desc: "How much of your country's population lives under your direct [control|el]. Calculated as #bold (controlled population / total population) − 1#!. A fully controlled country contributes nothing here; territories you do not yet control drag your [power_projection|el] downward. Invest in control infrastructure or release ungovernable provinces to recover."

 game_concept_sul_projection_cultural_friction: "Cultural Friction"
 game_concept_sul_projection_cultural_friction_desc: "The drag on your [power_projection|el] from population in cultures you have not [accepted_cultures|el]. Calculated as the share of your population in non-accepted cultures, on a 0..−1 scale. Accept more cultures, assimilate the differences, or release the offending land."

 game_concept_sul_projection_religious_friction: "Religious Friction"
 game_concept_sul_projection_religious_friction_desc: "The drag on your [power_projection|el] from population NOT following your state [religion|el]. Counts both heretics (same religious group) and heathens (different group entirely). Convert pops, change your state religion, or rule a more uniform empire to reduce."

 SUL_PROJECTION_DEBUG_DIPLO: "#bold DEBUG#! used: [Country.MakeScope.ScriptValue('sul_debug_diplo_used')|2] / base: [Country.MakeScope.ScriptValue('sul_debug_diplo_base')|2] / mod%: [Country.MakeScope.ScriptValue('sul_debug_diplo_modifier')|2] / total: [Country.MakeScope.ScriptValue('sul_debug_diplo_total')|2] / ratio: [Country.MakeScope.ScriptValue('sul_projection_diplo_usage_ratio')|2]"
