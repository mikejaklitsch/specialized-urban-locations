 AUTO_MODIFIER_NAME_sul_projection_drag_control: "[sul_projection_control_weighted_population|e]"
 AUTO_MODIFIER_NAME_sul_projection_drag_culture: "[sul_projection_cultural_friction|e]"
 AUTO_MODIFIER_NAME_sul_projection_drag_religion: "[sul_projection_religious_friction|e]"
 AUTO_MODIFIER_NAME_sul_projection_drag_stability: "[stability|e]"
 AUTO_MODIFIER_NAME_sul_projection_drag_subjects: "[sul_projection_subject_burden|e]"
 AUTO_MODIFIER_NAME_sul_projection_drag_conquest: "[sul_projection_recent_conquests|e]"
 AUTO_MODIFIER_NAME_sul_projection_rank: "[country_rank|e]"

 game_concept_sul_projection_control_weighted_population: "Control Weighted Population"
 game_concept_sul_projection_control_weighted_population_desc: "How much of your country's population lives under your direct [control|el]. Calculated as #bold (controlled population / total population) − 1#!. A fully controlled country contributes nothing here; territories you do not yet control drag your [power_projection|el] downward. Invest in control infrastructure or release ungovernable provinces to recover."

 game_concept_sul_projection_cultural_friction: "Cultural Friction"
 game_concept_sul_projection_cultural_friction_desc: "The drag on your [power_projection|el] from population in cultures you have not [accepted_cultures|el]. Calculated as the share of your population in non-accepted cultures, on a 0..−1 scale. Accept more cultures, assimilate the differences, or release the offending land."

 game_concept_sul_projection_religious_friction: "Religious Friction"
 game_concept_sul_projection_religious_friction_desc: "The drag on your [power_projection|el] from population NOT following your state [religion|el]. Counts both heretics (same religious group) and heathens (different group entirely). Convert pops, change your state religion, or rule a more uniform empire to reduce."

 game_concept_sul_projection_subject_burden: "Subject Burden"
 game_concept_sul_projection_subject_burden_desc: "The drag on your [power_projection|el] from your [subjects|el]. Each subject's [country_strength|el] is weighted by its subject type and summed, then divided by your own [country_strength|el]. Each multiple of your strength in subjects costs -25 [power_projection|el]. Release, integrate, or grow stronger to reduce."

 game_concept_sul_projection_recent_conquests: "Recent Conquests"
 game_concept_sul_projection_recent_conquests_desc: "Accumulated [power_projection|el] cost from recent territorial gains. Each conquest adds debt proportional to the [development|el] of the conquered location. The debt decays each month at a rate scaled by your [diplomatic_reputation|el] — better-regarded nations digest their gains faster. The debt is the only structural drag that 'doing nothing' will recover from naturally."
