l_english:
 a_levy_houfnice: "Levy Houfnice"
 a_levy_houfnice_desc: "Locally assembled cannons crewed by townsmen and laborers, these levy houfnice provide basic artillery support to levy armies."
 a_levy_falconet: "Levy Falconet"
 a_levy_falconet_desc: "Light cannons operated by levied burghers and laborers, providing field artillery capability to militia forces."
 a_levy_chambered_cannon: "Levy Chambered Cannon"
 a_levy_chambered_cannon_desc: "Standardized artillery pieces crewed by conscripted townsmen, bringing reliable firepower to levy formations."
 a_levy_royal_mortar: "Levy Mortar"
 a_levy_royal_mortar_desc: "Field mortars operated by levied crews, capable of providing indirect fire support to militia armies."
 a_levy_flying_battery: "Levy Flying Battery"
 a_levy_flying_battery_desc: "Mobile artillery batteries crewed by conscripted civilians, able to rapidly redeploy across the battlefield."
 sul_war_levy_houfnice: "Levy Houfnice"
 sul_war_levy_houfnice_desc: "Enables the recruitment of levy houfnice from local laborers and burghers."
 sul_war_levy_falconet: "Levy Falconet"
 sul_war_levy_falconet_desc: "Enables the recruitment of levy falconets from local laborers and burghers."
 sul_war_levy_chambered_cannon: "Levy Chambered Cannon"
 sul_war_levy_chambered_cannon_desc: "Enables the recruitment of levy chambered cannons from local laborers and burghers."
 sul_war_levy_royal_mortar: "Levy Mortar"
 sul_war_levy_royal_mortar_desc: "Enables the recruitment of levy mortars from local laborers and burghers."
 sul_war_levy_flying_battery: "Levy Flying Battery"
 sul_war_levy_flying_battery_desc: "Enables the recruitment of levy flying batteries from local laborers and burghers."
