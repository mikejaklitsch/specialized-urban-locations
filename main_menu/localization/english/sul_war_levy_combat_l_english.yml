l_english:
 levy_warfare_traditions: "The Nature of War"
 levy_warfare_traditions_desc: "A trained soldier has the advantage of discipline, but a levy has the advantage of being human. Our levied hosts may form ragged lines and march without cadence, yet a blade swung in earnest cuts no less deep for the lack of formal training. Put a weapon in common hands and they will use it. That is the nature of war."
