l_english:
 game_concept_sul_location_assets: "Local Assets"
 game_concept_sul_location_assets_desc: "Aggregate wealth held at this location — land, workshops, trade networks, and treasury. Assets generate capital returns (5% monthly) distributed by estate power. Maximum assets scale with local GDP and prosperity. Fast to destroy through war, slow to rebuild."
