l_english:
 game_concept_sul_location_assets: "Local Assets"
 game_concept_sul_location_assets_desc: "Physical wealth held at this location by each estate and the crown — land, workshops, trade networks, and treasury. Assets generate capital returns (2% monthly) that fund local demand. They converge toward an equilibrium set by the estate's share of national power. Fast to destroy through war, slow to rebuild."
