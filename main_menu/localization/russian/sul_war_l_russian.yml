 SUL_WAR_CW_CROWN_FORTS:0 "Укреплённые позиции [sul_war_civil_war_crown|E]"
 SUL_WAR_CW_CROWN_LOCS:0 "Неукреплённые позиции [sul_war_civil_war_crown|E]"
 SUL_WAR_CW_PRETENDER_FORTS:0 "Укреплённые позиции [sul_war_civil_war_pretender|E]"
 SUL_WAR_CW_PRETENDER_LOCS:0 "Неукреплённые позиции [sul_war_civil_war_pretender|E]"
 game_concept_sul_war_civil_war_crown:0 "Корона"
 game_concept_sul_war_civil_war_crown_desc:0 "Территория, удерживаемая правящим правительством во время гражданской войны. Сторона, контролирующая больше взвешенной территории (укреплённые позиции считаются в пять раз весомее), получает преимущество. Если корона удерживает меньше, чем претендент, применяются штрафы за оккупацию."
 game_concept_sul_war_civil_war_pretender:0 "Претендент"
 game_concept_sul_war_civil_war_pretender_desc:0 "Территория, удерживаемая мятежной фракцией во время гражданской войны. Сторона, контролирующая больше взвешенной территории (укреплённые позиции считаются в пять раз весомее), получает преимущество. Если претендент удерживает больше, чем корона, корона страдает от штрафов за оккупацию."
