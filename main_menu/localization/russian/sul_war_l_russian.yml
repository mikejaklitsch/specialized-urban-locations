 SUL_WAR_CAPITAL_RESILIENCE_HEADER:0 "[sul_war_momentum_capital|E]"
 SUL_WAR_PRESSURE_BREAKDOWN_HEADER:0 "Источники [sul_war_momentum_diplomatic_pressure|E]"
